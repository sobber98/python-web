# Copy this file to config.toml and edit local secrets before starting.

# Bootstrap admin password. It is required at startup, and it stays valid until
# you change the password from the settings page. After a change, the PBKDF2
# hash stored in the database takes precedence and this value is ignored.
admin_password = "change-me"

# Optional. If omitted, sessions are invalidated on each server restart.
secret_key = "replace-with-a-long-random-string"

# Optional runtime paths.
data_dir = "data"
# db_path = "data/manager.db"

# Optional session settings.
# session_max_age = 43200          # 12 hours, in seconds
# session_https_only = false       # set true when served over HTTPS

# Optional upper bound for uploaded script size, in bytes (default 10 MiB).
# max_upload_bytes = 10485760
